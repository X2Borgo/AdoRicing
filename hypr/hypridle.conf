# Hypridle
# Original config submitted by https://github.com/SherLock707

$iDIR="$HOME/.config/swaync/images/ja.png"
$scriptsDir="$HOME/.config/hypr/scripts"

general {
    lock_cmd = $scriptsDir/LockScreen.sh --logind-hook # prefer DMS/Caelestia lock; fall back to hyprlock only if it fails
    # unlock_cmd = killall hyprlock # kills hyprlock when unlocking (this is always run when "loginctl unlock-session" is called)
    before_sleep_cmd = loginctl lock-session    # ensures that the session is locked before going to sleep
    after_sleep_cmd = hyprctl dispatch dpms on # turn on screen after sleep
    ignore_dbus_inhibit = false                 # respect idle-inhibit requests from applications
}

# Warn after 9 minutes.
listener {
    timeout = 540
    on-timeout = notify-send -i $iDIR " You are idle!"
    on-resume = notify-send -i $iDIR " Oh! you're Back" " Hello !!!"
}

# Lock after 10 minutes.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

