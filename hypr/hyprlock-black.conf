# Stealth ("blackout") hyprlock config — used by LockScreen.sh --stealth as the
# fallback when DMS is unavailable. Nothing is drawn: no wallpaper, no clock, no
# visible input field. The screen stays pure black, so the machine reads as off.
# Typing the password and pressing Enter still unlocks.

general {
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    color = rgb(0,0,0)
    blur_passes = 0
}

# Invisible input field: no outline, no dots, no placeholder.
input-field {
    monitor =
    size = 1, 1
    outline_thickness = 0
    dots_size = 0.0
    dots_spacing = 0.0
    outer_color = rgba(0,0,0,0)
    inner_color = rgba(0,0,0,0)
    font_color = rgba(0,0,0,0)
    check_color = rgba(0,0,0,0)
    fail_color = rgba(0,0,0,0)
    capslock_color = rgba(0,0,0,0)
    fail_text =
    placeholder_text =
    fade_on_empty = false
    hide_input = true
    position = 0, 0
    halign = center
    valign = center
}
