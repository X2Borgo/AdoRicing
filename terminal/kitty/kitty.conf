# --- Performance Optimizations ---
repaint_delay 10
input_delay 3
sync_to_monitor no

# --- Scrollback ---
scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
wheel_scroll_multiplier 5.0

# --- Mouse ---
mouse_hide_wait 3.0
url_color #00f0ff
url_style curly
open_url_with default
detect_urls yes
copy_on_select no

# --- Bell ---
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell yes
bell_on_tab "🔔 "

# --- Tabs ---
tab_bar_edge top
tab_bar_style custom
tab_powerline_style slanted
tab_title_template "{title}"
active_tab_foreground #0f152e
active_tab_background #00f0ff
active_tab_font_style bold
inactive_tab_foreground #c0c0c0
inactive_tab_background #1a2035
inactive_tab_font_style normal

# --- Fonts ---
# Use a Nerd Font for icons (fastfetch/starship support)
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# --- Cursor ---
cursor_shape     beam

# --- Window Look ---
# Padding (internal margins)
window_padding_width 10

# Window borders and margins (from ikitty)
window_border_width 1pt
draw_minimal_borders yes
window_margin_width 2
single_window_margin_width 2
active_border_color #00f0ff
inactive_border_color #4d556d
hide_window_decorations no

# --- Transparency & Blur ---
# 0.95 is a good balance between readability and aesthetics
background_opacity 0.95
# Note: Background blur is not supported natively by Kitty on all platforms,
# but your compositor (KWin/Picom) usually handles it.

# --- Window Management ---
allow_remote_control yes
listen_on unix:${XDG_RUNTIME_DIR}/ado-kitty-{kitty_pid}
startup_session ado-session.conf
remember_window_size yes
initial_window_width 1200
initial_window_height 700
enabled_layouts tall,stack,fat,grid
window_resize_step_cells 2
window_resize_step_lines 2
confirm_os_window_close 0

# --- Ado / Hibana Color Theme ---

# The Deep Navy Background
background #0f152e
foreground #c0c0c0

# Cursor (Cyan)
cursor #00f0ff
cursor_text_color #0f152e

# Selection Highlight
selection_foreground #0f152e
selection_background #00f0ff

# --- The 16 Colors ---

# Black (Dark Navy / Gray)
color0 #1a2035
color8 #4d556d

# Red (Error / Warning)
color1 #ff4d4d
color9 #ff6e6e

# Green (Success / Info)
color2 #00e0b0
color10 #50fae6

# Yellow (Warning)
color3 #ffcc00
color11 #ffe066

# Blue (Ado Blue)
color4 #2b65ff
color12 #5c8dff

# Magenta (Hibana Glow)
color5 #d000ff
color13 #e666ff

# Cyan (Accents)
color6 #00f0ff
color14 #80f7ff

# White (Text)
color7 #e0e0e0
color15 #ffffff

# --- map keyboard shortucts ---

# Open new tab after the current one, in the same directory
map ctrl+t launch --cwd=current --type=tab --location=after
map ctrl+shift+t launch --cwd=current --type=tab --location=after

# Open new window (split) in the same directory
map ctrl+shift+enter launch --cwd=current --type=window

# Open a new OS window in the same directory as the current one
map ctrl+shift+n launch --cwd=current --type=os-window

# move through tabs
map alt+left  previous_tab
map alt+right next_tab
map alt+up    previous_window
map alt+down  next_window

# reorder the current tab (move its position left/right)
map ctrl+alt+left  move_tab_backward
map ctrl+alt+right move_tab_forward

# left click on a link opens it
mouse_map left click ungrabbed mouse_handle_click prompt
mouse_map ctrl+left click ungrabbed mouse_handle_click link

# Resize windows
map ctrl+shift+left resize_window narrower
map ctrl+shift+right resize_window wider
map ctrl+shift+up resize_window taller
map ctrl+shift+down resize_window shorter

# Layout management
map ctrl+shift+l next_layout

# Miscellaneous
map ctrl+shift+f2 set_tab_title
map ctrl+alt+q launch --type=background /home/alborghi/.config/hypr/scripts/CycleKittyQuestionTabs.sh
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0 change_font_size all 0

# --- Wayland-specific (if using Wayland) ---
wayland_titlebar_color background
linux_display_server auto
